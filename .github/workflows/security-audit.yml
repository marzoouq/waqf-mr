name: Weekly Security Audit

on:
  schedule:
    # كل أحد 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install (lockfile only, no scripts)
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Dependency version drift check
        run: node scripts/dependency-drift-check.mjs

      - name: Edge Functions doc drift check
        run: node scripts/count-edge-functions.mjs --check

      - name: Dependency security gate (same gate as CI)
        id: audit
        run: |
          set +e
          npm run security:deps
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            audit/dependency-security.json
            audit/dependency-security.md
          retention-days: 90

      - name: Open issue on high/critical
        if: steps.audit.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('audit/dependency-security.json', 'utf8'));
            const v = report.totals || {};
            const title = `🔒 Weekly audit: ${v.high || 0} high / ${v.critical || 0} critical`;
            const summary = fs.existsSync('audit/dependency-security.md')
              ? fs.readFileSync('audit/dependency-security.md', 'utf8')
              : '';
            const body = [
              summary,
              '',
              'راجع artifact `npm-audit-report` للتفاصيل الكاملة.',
              '',
              'راجع أيضاً: `docs/security/weekly-audit.md` لخطوات المعالجة.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'auto'],
            });
