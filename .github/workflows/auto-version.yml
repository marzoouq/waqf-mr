name: Auto Version Bump & Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/changelog.json'
      - 'docs/**'
      - '**/*.md'
      - '.github/**'
      - 'audit/**'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate — require feat:/fix: since last tag
        id: gate
        run: |
          LAST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1 || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$LAST_TAG..HEAD"
          fi
          if git log $RANGE --pretty="%s" | grep -qiE '^(feat|fix)(\(|:)'; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::لا يوجد feat:/fix: منذ آخر tag — تخطي bump"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Setup Node
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get current version
        id: current
        if: steps.gate.outputs.proceed == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        if: steps.gate.outputs.proceed == 'true'
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Sync package-lock.json
        if: steps.gate.outputs.proceed == 'true'
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate Arabic date
        id: date
        if: steps.gate.outputs.proceed == 'true'
        run: |
          MONTHS=("يناير" "فبراير" "مارس" "أبريل" "مايو" "يونيو" "يوليو" "أغسطس" "سبتمبر" "أكتوبر" "نوفمبر" "ديسمبر")
          DAY=$(date -u +%-d)
          MONTH_IDX=$(($(date -u +%-m) - 1))
          YEAR=$(date -u +%Y)
          to_arabic() {
            echo "$1" | sed 'y/0123456789/٠١٢٣٤٥٦٧٨٩/'
          }
          AR_DATE="$(to_arabic $DAY) ${MONTHS[$MONTH_IDX]} $(to_arabic $YEAR)"
          echo "arabic=$AR_DATE" >> "$GITHUB_OUTPUT"

      - name: Collect commits since last tag
        id: commits
        if: steps.gate.outputs.proceed == 'true'
        run: |
          LAST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1 || echo "")
          if [ -z "$LAST_TAG" ]; then
            git log --oneline --no-merges -20 --pretty="%s" > /tmp/commits.txt
          else
            git log "$LAST_TAG"..HEAD --oneline --no-merges --pretty="%s" > /tmp/commits.txt
          fi

          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('/tmp/commits.txt','utf8').split('\n').filter(Boolean);
            const SKIP_TYPES = /^(chore|refactor|perf|style|test|ci|build|docs)(\(|:)/i;
            const hasArabic = (s) => /[\u0600-\u06FF]/.test(s);
            const changes = [];
            for (const msg of lines) {
              if (/\[skip ci\]/i.test(msg)) continue;
              if (/^Merge /i.test(msg)) continue;
              if (SKIP_TYPES.test(msg)) continue;
              const clean = msg.replace(/^(feat|fix|improvement)(\([^)]+\))?:\s*/i, '').trim();
              if (clean.length < 5) continue;
              // ارفض رسائل بدون عربية ما لم تكن feat/fix صريحة
              const isExplicit = /^(feat|fix)(\(|:)/i.test(msg);
              if (!isExplicit && !hasArabic(clean)) continue;
              const type = /^feat(\(|:)/i.test(msg) ? 'feature' : /^fix(\(|:)/i.test(msg) ? 'fix' : 'improvement';
              changes.push({ type, text: clean });
            }
            if (!changes.length) changes.push({ type: 'improvement', text: 'تحسينات وإصلاحات متنوعة' });
            fs.writeFileSync('/tmp/changes.json', JSON.stringify(changes));
          "

      - name: Update changelog.json
        if: steps.gate.outputs.proceed == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const changelog = JSON.parse(fs.readFileSync('public/changelog.json', 'utf8'));
            const changes = JSON.parse(fs.readFileSync('/tmp/changes.json', 'utf8'));
            changelog.unshift({
              version: '${{ steps.bump.outputs.version }}',
              date: '${{ steps.date.outputs.arabic }}',
              changes
            });
            fs.writeFileSync('public/changelog.json', JSON.stringify(changelog, null, 2) + '\n');
          "

      - name: Check if tag exists
        id: check_tag
        if: steps.gate.outputs.proceed == 'true'
        run: |
          TAG="v${{ steps.bump.outputs.version }}"
          git fetch --tags --quiet || true
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG already exists — skipping tag creation"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/changelog.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }} [skip ci]"
          TAG_EXISTS="${{ steps.check_tag.outputs.exists }}"
          if [ "$TAG_EXISTS" != "true" ]; then
            git tag "v${{ steps.bump.outputs.version }}"
          fi
          for i in 1 2 3; do
            git pull --rebase origin main || { echo "Rebase failed"; sleep 5; continue; }
            if [ "$TAG_EXISTS" != "true" ]; then
              git push --atomic origin main "v${{ steps.bump.outputs.version }}" && exit 0
            else
              git push origin main && exit 0
            fi
            echo "Retry $i..."
            sleep 5
          done
          echo "::error::Push failed after 3 retries"
          exit 1

