name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npx eslint src/

      - name: Security audit
        run: |
          npm audit --audit-level=high --omit=dev || true
          npm audit --audit-level=high --omit=dev --json > audit-report.json
          if [ $(grep -c '"severity":"high"\|"severity":"critical"' audit-report.json) -gt 0 ]; then
            echo "::error::عثر على ثغرات عالية/حرجة في التبعيات"
            exit 1
          fi

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        if: ${{ always() && secrets.CODECOV_TOKEN != '' && hashFiles('coverage/coverage-final.json') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
