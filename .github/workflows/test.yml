name: Run Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ملاحظة: TypeScript + ESLint + Security audit + PR tests تُشغَّل حصراً في ci.yml
      # كمرجع وحيد. هذا الـ workflow مخصص لتغطية Vitest بعد الدمج أو عند التشغيل اليدوي.


      - name: Run tests with coverage
        run: npx vitest run --coverage

      # اختبارات دوال الحافة (Deno) — بوابة إلزامية بعد إدراجها في المسار
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run edge function tests
        run: npm run test:edge

      - name: Upload coverage to Codecov
        if: ${{ always() && secrets.CODECOV_TOKEN != '' && hashFiles('coverage/coverage-final.json') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
