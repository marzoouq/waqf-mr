name: CI Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_doc_sync:
        description: 'Compare doc vs script allowlist'
        required: false
        default: 'true'
      check_db_sync:
        description: 'Compare DB vs allowlist'
        required: false
        default: 'true'
      definer_schemas:
        description: 'Comma-separated schemas to scan (default: public)'
        required: false
        default: 'public'
      definer_name_pattern:
        description: 'POSIX regex to include function names (default: .*)'
        required: false
        default: '.*'
      definer_exclude_pattern:
        description: 'POSIX regex to exclude function names (default: ^$)'
        required: false
        default: '^$'
      strict_mode:
        description: 'Fail build on any mismatch'
        required: false
        default: 'true'

jobs:
  quality:
    name: TypeScript + ESLint + Tests + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block tracked .env files
        run: |
          if git ls-files --error-unmatch '.env' 2>/dev/null; then
            echo "::error::ملف .env متعقَّب في git — يجب إزالته عبر: git rm --cached .env"
            exit 1
          fi
          TRACKED_ENV=$(git ls-files | grep -E '^\.env(\.|$)' | grep -v '\.example$' || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "::error::ملفات .env التالية متعقَّبة في git:"
            echo "$TRACKED_ENV"
            exit 1
          fi
          echo "✅ لا توجد ملفات .env متعقَّبة"

      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npx eslint src/

      - name: Lint conventions (lib/hooks/page boundary)
        run: npm run lint:conventions

      - name: UI permissions audit (no GAPs)
        run: |
          node scripts/audit-ui-permissions.mjs
          GAPS=$(tail -n +2 audit/ui-permissions-audit.csv | grep -c '^.' || true)
          if [ "$GAPS" -gt 0 ]; then
            echo "::error::وُجدت $GAPS فجوة صلاحيات UI"
            cat audit/ui-permissions-audit.csv
            exit 1
          fi
          echo "✅ 0 فجوات صلاحيات UI"

      - name: Permissions matrix integrity (156 rows)
        run: |
          node scripts/build-permissions-matrix.mjs
          ROWS=$(tail -n +2 audit/ui-permissions-matrix.csv | wc -l | tr -d ' ')
          if [ "$ROWS" != "156" ]; then
            echo "::error::مصفوفة الصلاحيات: متوقع 156 صف، وُجد $ROWS"
            exit 1
          fi
          echo "✅ مصفوفة الصلاحيات: 156 صف"

      - name: Audit gate (structure + conventions + hooks layout)
        run: npm run audit

      - name: Audit critical gate (Vitest)
        run: npm run audit:gate

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit/
          retention-days: 14

      - name: Run tests
        run: npx vitest run


      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

      - name: Edge Functions security gates (PII / getSession / SERVICE_ROLE allowlist)
        run: node scripts/security-gates.mjs



      - name: Supabase security linter (0028 / 0029 gate)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/supabase-lint-check.mjs

      - name: SECURITY DEFINER allowlist sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CHECK_DOC_SYNC: ${{ github.event.inputs.check_doc_sync || 'true' }}
          CHECK_DB_SYNC: ${{ github.event.inputs.check_db_sync || 'true' }}
          DEFINER_SCHEMAS: ${{ github.event.inputs.definer_schemas || 'public' }}
          DEFINER_NAME_PATTERN: ${{ github.event.inputs.definer_name_pattern || '.*' }}
          DEFINER_EXCLUDE_PATTERN: ${{ github.event.inputs.definer_exclude_pattern || '^$' }}
          STRICT_MODE: ${{ github.event.inputs.strict_mode || 'true' }}
        run: node scripts/security-definer-sync-check.mjs

      - name: Build
        run: npm run build

      - name: Bundle size report
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          du -sh dist/assets/*.js | sort -rh | head -10 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          TOTAL_KB=$(du -sk dist/ | cut -f1)
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$TOTAL_KB" -gt 5120 ]; then
            echo "⚠️ **تحذير:** حجم الحزمة تجاوز 5 ميغابايت ($TOTAL_KB KB)" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ حجم الحزمة ضمن الحد المقبول ($TOTAL_KB KB)" >> $GITHUB_STEP_SUMMARY
          fi
